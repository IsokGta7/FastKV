name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Same commit as builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  linux:
    name: Linux GCC (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            sanitize: address,undefined
          - name: TSan
            sanitize: thread
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 runners use 32 bits of mmap randomisation, which
      # ThreadSanitizer in GCC 13 cannot map around.
      - name: Reduce ASLR entropy for TSan
        if: matrix.sanitize == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-linux-gcc-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-gcc-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Point vcpkg at the cached binaries
        run: |
          mkdir -p "${{ runner.temp }}/vcpkg-bincache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DFASTKV_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: vcpkg-windows-msvc-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-msvc-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Point vcpkg at the cached binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}\vcpkg-bincache" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}\vcpkg-bincache,readwrite" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
